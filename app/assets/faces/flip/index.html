<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flip</title>
<style>
  html,body{margin:0;width:960px;height:480px;overflow:hidden;background:#07090c;color:#eaf6ff;
    font-family:"Helvetica Neue",Roboto,Arial,sans-serif;user-select:none;-webkit-user-select:none;cursor:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #clock{display:flex;align-items:center;gap:8px;}
  .fd{position:relative;width:120px;height:176px;perspective:700px;background:#12161c;
    border-radius:12px;font-size:150px;box-shadow:0 10px 26px rgba(0,0,0,.6),inset 0 0 0 1px #1e242c;}
  .hl{position:absolute;left:0;width:100%;height:50%;overflow:hidden;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  .hl.up{top:0;border-radius:12px 12px 0 0;background:#171c23;}
  .hl.dn{top:50%;border-radius:0 0 12px 12px;background:#0f1319;}
  .hl span{position:absolute;left:0;width:100%;height:200%;line-height:176px;text-align:center;
    color:#eaf6ff;font-weight:600;font-variant-numeric:tabular-nums;}
  .hl.up span{top:0;}
  .hl.dn span{top:-100%;}
  .fu{transform-origin:50% 100%;z-index:4;transition:transform .16s ease-in;}
  .fu.fold{transform:rotateX(-90deg);}
  .fb{transform-origin:50% 0;z-index:4;transform:rotateX(90deg);transition:transform .16s ease-out;}
  .fb.unfold{transform:rotateX(0deg);}
  .seam{position:absolute;left:0;top:calc(50% - 1px);width:100%;height:2px;background:#05070a;z-index:5;}
  .colon{display:flex;flex-direction:column;gap:14px;padding:0 2px;}
  .colon i{width:12px;height:12px;border-radius:50%;background:#3fd0ff;display:block;
    box-shadow:0 0 16px rgba(63,208,255,.85);transition:opacity .2s;}
  .colon.off i{opacity:.12;}
  #date{position:fixed;left:0;right:0;bottom:22px;text-align:center;font-size:22px;letter-spacing:.3em;
    text-transform:uppercase;color:#6f93a8;}
</style>
</head>
<body>
<div id="wrap"><div id="clock"></div></div>
<div id="date"></div>
<script>
(function(){
  var cfg={},st={},els=[];
  function accColor(){return (typeof cfg.accent==='string'&&cfg.accent)?cfg.accent:'#3fd0ff';}
  function ps(v){if(v==null)return {};if(typeof v==='string'){try{return JSON.parse(v)||{};}catch(e){return {};}}return v;}
  function pad(n){return (n<10?'0':'')+n;}
  function el(tag,cls){var e=document.createElement(tag);if(cls)e.className=cls;return e;}
  function makeDigit(){
    var d=el('div','fd');
    d.appendChild(el('div','hl up')).appendChild(el('span'));
    d.appendChild(el('div','hl dn')).appendChild(el('span'));
    d.appendChild(el('div','hl up fu')).appendChild(el('span'));
    d.appendChild(el('div','hl dn fb')).appendChild(el('span'));
    d.appendChild(el('div','seam'));
    return d;
  }
  function setDigit(d,v){
    if(d._v===v)return;
    var up=d.querySelector('.up:not(.fu) span'),dn=d.querySelector('.dn:not(.fb) span');
    var fu=d.querySelector('.fu span'),fb=d.querySelector('.fb span');
    var old=d._v;
    d._v=v;
    up.textContent=v;dn.textContent=v;
    fu.textContent=(old==null?v:old);
    fb.textContent=v;
    fu.classList.remove('fold');fb.classList.remove('unfold');
    void d.offsetWidth;
    fu.classList.add('fold');fb.classList.add('unfold');
    if(d._t)clearTimeout(d._t);
    d._t=setTimeout(function(){
      fu.classList.remove('fold');fb.classList.remove('unfold');fu.textContent=v;
    },380);
  }
  function build(){
    var clock=document.getElementById('clock');
    clock.innerHTML='';els=[];
    var n=(cfg.showSeconds===false)?4:6;
    for(var i=0;i<n;i++){
      if(i>0&&i%2===0){
        var col=el('div','colon');
        col.appendChild(el('i'));col.appendChild(el('i'));
        clock.appendChild(col);els.push({sep:true,node:col});
      }
      var d=makeDigit();clock.appendChild(d);els.push({node:d});
    }
  }
  function render(){
    var t=(typeof st.epoch==='number')?st.epoch:Date.now();
    var d=new Date(t);
    var h24=(cfg.format24h===true)||(cfg.hour12===false);
    var h=d.getHours();
    if(!h24){h=h%12;if(h===0)h=12;}
    var digits=(pad(h)+pad(d.getMinutes())+((cfg.showSeconds===false)?'':pad(d.getSeconds()))).split('');
    var di=0;
    for(var i=0;i<els.length;i++){
      if(els[i].sep){
        els[i].node.className='colon'+(d.getSeconds()%2?' off':'');
        var dots=els[i].node.children;
        for(var k=0;k<dots.length;k++){
          dots[k].style.background=accColor();
          dots[k].style.boxShadow='0 0 16px '+accColor();
        }
        continue;
      }
      setDigit(els[i].node,digits[di++]||'0');
    }
    var de=document.getElementById('date');
    if(cfg.showDate===false){de.textContent='';}
    else{
      var loc=typeof st.locale==='string'?st.locale:undefined;
      try{de.textContent=new Intl.DateTimeFormat(loc,{weekday:'long',month:'long',day:'numeric'}).format(d);}
      catch(e){try{de.textContent=d.toDateString();}catch(e2){de.textContent='';}}
    }
  }
  window.ec={
    config:function(c){cfg=ps(c);build();render();},
    tick:function(s){st=ps(s);render();},
    event:function(n,p){if(p&&typeof p==='object'&&typeof p.epoch==='number'){window.ec.tick(p);}}
  };
  build();render();
  setInterval(render,1000);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Agenda</title>
<style>
  html,body{margin:0;width:960px;height:480px;overflow:hidden;background:#05070a;color:#e8f4ff;
    font-family:"Helvetica Neue",Roboto,Arial,sans-serif;user-select:none;-webkit-user-select:none;cursor:none;}
  #wrap{position:fixed;inset:0;display:flex;}
  #left{width:400px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
    padding:0 26px;box-sizing:border-box;gap:6px;}
  #time{font-size:132px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums;
    text-shadow:0 0 50px rgba(64,200,255,.3);}
  #date{font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:#7ea8bd;}
  #extra{display:flex;flex-direction:column;gap:4px;font-size:22px;color:#8fb4c8;margin-top:8px;
    max-width:348px;}
  #extra>div{display:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  #extra>div.on{display:block;}
  #rule{width:1px;background:#16222c;margin:26px 0;}
  #right{flex:1;display:flex;flex-direction:column;padding:22px 26px 22px 10px;box-sizing:border-box;}
  #heading{font-size:17px;letter-spacing:.34em;text-transform:uppercase;color:#5f7c8c;margin-bottom:10px;}
  #events{flex:1;display:flex;flex-direction:column;gap:8px;overflow:hidden;}
  .row{display:flex;align-items:baseline;gap:14px;border-left:3px solid #4fd6ff;padding:6px 0 6px 12px;
    background:#0a0f15;border-radius:0 10px 10px 0;}
  .row.soon{border-left-color:#ffcf3f;}
  .et{width:88px;font-size:22px;color:#cfe3f0;font-variant-numeric:tabular-nums;flex:none;}
  .etitle{flex:1;font-size:28px;color:#eef6ff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .erel{font-size:20px;color:#6f93a8;flex:none;padding-right:10px;}
  #empty{color:#44606f;font-size:24px;margin-top:8px;}
</style>
</head>
<body>
<div id="wrap">
  <div id="left">
    <div id="time">--:--</div>
    <div id="date"></div>
    <div id="extra">
      <div id="iAlarm"></div>
      <div id="iWeather"></div>
    </div>
  </div>
  <div id="rule"></div>
  <div id="right">
    <div id="heading">Upcoming</div>
    <div id="events"></div>
    <div id="empty">No upcoming events</div>
  </div>
</div>
<script>
(function(){
  var cfg={},st={};
  function ps(v){if(v==null)return {};if(typeof v==='string'){try{return JSON.parse(v)||{};}catch(e){return {};}}return v;}
  function pad(n){return (n<10?'0':'')+n;}
  function is24(){return (cfg.format24h===true)||(cfg.hour12===false);}
  function clockH(h){h=h%12;if(h===0)h=12;return h;}
  function hhmm(ms){
    var d=new Date(ms);
    if(is24())return pad(d.getHours())+':'+pad(d.getMinutes());
    return clockH(d.getHours())+':'+pad(d.getMinutes())+(d.getHours()<12?'am':'pm');
  }
  function inText(mins){
    var m=Math.round(mins);
    if(m<=0)return 'now';
    if(m<60)return 'in '+m+'m';
    var h=Math.floor(m/60),r=m%60;
    return 'in '+h+'h'+(r?(' '+r+'m'):'');
  }
  function evLine(ev){
    if(!ev||typeof ev!=='object')return null;
    var when=ev.allDay?'All day':hhmm(ev.begin);
    var rel=(typeof ev.inMinutes==='number'&&!ev.allDay)?inText(ev.inMinutes):'';
    return {when:when,title:(typeof ev.title==='string'&&ev.title)?ev.title:'Event',rel:rel,soon:rel==='now'};
  }
  function renderEvents(list){
    var box=document.getElementById('events');
    var sig=JSON.stringify(list.map(function(e){return e.when+'|'+e.title+'|'+e.rel;}));
    if(box._sig===sig)return;
    box._sig=sig;
    box.innerHTML='';
    for(var i=0;i<list.length;i++){
      var row=document.createElement('div');
      row.className='row'+(list[i].soon?' soon':'');
      var et=document.createElement('div');et.className='et';et.textContent=list[i].when;
      var tt=document.createElement('div');tt.className='etitle';tt.textContent=list[i].title;
      var rl=document.createElement('div');rl.className='erel';rl.textContent=list[i].rel;
      row.appendChild(et);row.appendChild(tt);row.appendChild(rl);
      box.appendChild(row);
    }
    document.getElementById('empty').style.display=list.length?'none':'block';
  }
  function setLine(id,txt){
    var el=document.getElementById(id);
    if(!el)return;
    var s=(typeof txt==='string')?txt:'';
    el.textContent=s;
    el.className=s?'on':'';
  }
  function render(){
    var t=(typeof st.epoch==='number')?st.epoch:Date.now();
    var d=new Date(t);
    var h=d.getHours();
    if(!is24())h=clockH(h);
    document.getElementById('time').textContent=pad(h)+':'+pad(d.getMinutes());
    var de=document.getElementById('date');
    var loc=typeof st.locale==='string'?st.locale:undefined;
    try{de.textContent=new Intl.DateTimeFormat(loc,{weekday:'long',month:'long',day:'numeric'}).format(d);}
    catch(e){try{de.textContent=d.toDateString();}catch(e2){de.textContent='';}}
    // v3 lines (DESIGN §9.5); each hides when disabled or the data is missing.
    var alarm=(st&&st.nextAlarm&&typeof st.nextAlarm==='object')?st.nextAlarm:null;
    setLine('iAlarm',(cfg.showAlarm!==false&&alarm&&typeof alarm.epoch==='number')?('Alarm '+hhmm(alarm.epoch)):'');
    var w=(st&&st.weather&&typeof st.weather==='object')?st.weather:null;
    var wt='';
    if(cfg.showWeather!==false&&w){
      // Unit is a per-face setting (default °F); the app supplies both tempC and tempF.
      var u=(cfg.tempUnit==='C')?'C':'F';
      var temp=(u==='F')?(typeof w.tempF==='number'?w.tempF:w.tempC):(typeof w.tempC==='number'?w.tempC:w.tempF);
      if(typeof temp==='number')wt=Math.round(temp)+'\u00b0'+u+' '+(w.text||'')+(w.stale===true?' (stale)':'');
    }
    setLine('iWeather',wt);
    var cal=(st&&st.calendar instanceof Array)?st.calendar:[];
    var max=(typeof cfg.maxEvents==='number'&&cfg.maxEvents>0)?Math.min(8,cfg.maxEvents):5;
    var lines=[];
    for(var i=0;i<cal.length&&lines.length<max;i++){
      var line=evLine(cal[i]);
      if(line)lines.push(line);
    }
    renderEvents(lines);
  }
  window.ec={
    config:function(c){cfg=ps(c);render();},
    tick:function(s){st=ps(s);render();},
    event:function(n,p){if(p&&typeof p==='object'&&typeof p.epoch==='number'){window.ec.tick(p);}}
  };
  render();
  setInterval(render,1000);
})();
</script>
</body>
</html>
